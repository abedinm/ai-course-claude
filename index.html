<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d09">
<title>Claude Interactive AI Course</title>
<style>
:root{--bg:#120d09;--a:#d6a56d;--b:#7dd3fc;--c:#fda4af;--panel:rgba(255,255,255,.075);--panel2:rgba(255,255,255,.11);--line:rgba(255,255,255,.18);--text:#f8fbff;--muted:rgba(248,251,255,.72);--bad:#fb7185;--good:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--a) 28%,transparent),transparent 32rem),radial-gradient(circle at 85% 12%,color-mix(in srgb,var(--b) 24%,transparent),transparent 30rem),linear-gradient(135deg,var(--bg),#020309 70%);overflow-x:hidden;letter-spacing:0}
button,input,textarea{font:inherit}button{cursor:pointer}pre,code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.stars{position:fixed;inset:0;z-index:-2;background:transparent}.particle{position:absolute;border-radius:50%;background:var(--a);box-shadow:0 0 16px var(--a);opacity:.75;animation:float var(--d) linear infinite;transform:translate3d(var(--x),110vh,0) scale(var(--s))}
@keyframes float{to{transform:translate3d(calc(var(--x) + var(--drift)),-12vh,0) scale(var(--s));opacity:.05}}.aurora{position:fixed;inset:auto -20% -35% -20%;height:44vh;z-index:-1;background:linear-gradient(90deg,var(--a),var(--b),var(--c));filter:blur(70px);opacity:.22;animation:pulse 9s ease-in-out infinite alternate}@keyframes pulse{to{transform:translateY(-7vh) rotate(3deg);opacity:.34}}
.app{width:min(1220px,100%);margin:0 auto;padding:22px clamp(14px,3vw,28px) 42px}.top{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;align-items:stretch}.hero,.stat,.card,.module,.daily,.leader,.path,.sandbox,.lesson,.quizBox{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));backdrop-filter:blur(18px);box-shadow:0 20px 80px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.08);border-radius:18px}.hero{padding:26px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:230px;height:230px;border-radius:50%;border:40px solid color-mix(in srgb,var(--a) 22%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--b) 45%,transparent)}.brand{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{width:46px;height:46px;border-radius:14px;background:conic-gradient(from 140deg,var(--a),var(--b),var(--c),var(--a));box-shadow:0 0 28px color-mix(in srgb,var(--a) 52%,transparent)}h1{font-size:clamp(2.1rem,6vw,4.8rem);line-height:.95;margin:16px 0 10px;letter-spacing:0}.sub{color:var(--muted);font-size:clamp(1rem,2.2vw,1.22rem);max-width:62ch}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.08);color:var(--muted);font-size:.86rem}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:16px}.stat b{display:block;font-size:1.55rem}.label{color:var(--muted);font-size:.88rem}.xpbar{height:14px;background:rgba(255,255,255,.11);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.xpfill{height:100%;width:0%;background:linear-gradient(90deg,var(--a),var(--b),var(--c));box-shadow:0 0 22px var(--a);transition:width .7s cubic-bezier(.2,.8,.2,1)}.grid{display:grid;grid-template-columns:1fr 330px;gap:16px;margin-top:16px}.modules{display:grid;gap:16px}.module{overflow:hidden}.modHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px}.modTitle{display:flex;gap:12px;align-items:center}.nodeBadge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900;color:#020309}.lock{opacity:.48;filter:saturate(.3)}.tabs{display:flex;gap:8px;padding:0 18px 14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:9px 12px}.tab.active{background:linear-gradient(135deg,var(--a),var(--b));color:#020309;font-weight:800}.panel{display:none;padding:0 18px 18px}.panel.active{display:block}.lesson{padding:16px;margin-bottom:12px}.lesson h3{margin:0 0 8px}.tag{display:inline-block;color:#061014;background:var(--c);border-radius:999px;padding:4px 8px;font-size:.75rem;font-weight:800;margin-bottom:8px}.lesson p{color:var(--muted);line-height:1.6}.lesson pre{white-space:pre-wrap;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:13px;border-radius:12px;overflow:auto}.note{border-left:4px solid var(--a);background:rgba(255,255,255,.07);padding:10px 12px;border-radius:10px;color:var(--text)}.quizBox{padding:16px;margin-bottom:12px}.options{display:grid;gap:9px;margin-top:12px}.option{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:12px;padding:11px;text-align:left}.option.correct{border-color:var(--good);background:rgba(52,211,153,.18)}.option.wrong{border-color:var(--bad);background:rgba(251,113,133,.16)}.feedback{color:var(--muted);margin-top:9px;min-height:22px}.sandbox{padding:16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:8px 10px}.prompt{width:100%;min-height:92px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);border-radius:14px;padding:12px;resize:vertical}.run{margin-top:10px;border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900;color:#020309}.output{margin-top:12px;min-height:90px;border:1px solid var(--line);background:rgba(0,0,0,.28);border-radius:14px;padding:13px;color:var(--muted);line-height:1.55}.side{display:grid;gap:16px;align-content:start}.daily,.leader,.path{padding:16px}.daily h2,.leader h2,.path h2{margin:0 0 10px}.challenge{border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted)}.claim{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px}.leader table{width:100%;border-collapse:collapse}.leader td{padding:8px;border-bottom:1px solid rgba(255,255,255,.1);color:var(--muted)}.leader .you td{color:var(--text);font-weight:900}.pathNodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pathNode{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.06);position:relative}.pathNode.done{background:linear-gradient(135deg,var(--a),var(--b));color:#020309;font-weight:900}.install{position:fixed;left:16px;right:16px;bottom:16px;z-index:5;display:none;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#080b12;box-shadow:0 20px 60px rgba(0,0,0,.45)}.toast{position:fixed;right:16px;top:16px;z-index:10;display:grid;gap:10px}.pop{background:#071017;border:1px solid var(--line);border-left:5px solid var(--a);box-shadow:0 12px 50px rgba(0,0,0,.45);border-radius:14px;padding:12px;animation:slide .35s ease both}@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}.offline{background:rgba(251,113,133,.15)}.online{background:rgba(52,211,153,.14)}
@media(max-width:900px){.top,.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat b{font-size:1.15rem}}@media(max-width:620px){.app{padding:14px 10px 96px}.hero,.stat,.module,.daily,.leader,.path{border-radius:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.modHead{align-items:flex-start}.pathNodes{grid-template-columns:repeat(3,1fr)}.install{display:none;flex-direction:column;align-items:stretch}.install button{width:100%}}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="aurora"></div><div class="toast" id="toast"></div>
<main class="app">
  <section class="top">
    <div class="hero">
      <div class="brand"><div class="logo"></div><span class="pill">Anthropic</span><span class="pill" id="net">Checking...</span></div>
      <h1>Claude</h1><p class="sub">Constitutional AI, safety, long context, and document analysis</p>
      <div class="status"><span class="pill">Single-file course</span><span class="pill">Offline capable</span><span class="pill">Gamified learning</span></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">XP</span><b id="xp">0</b><div class="xpbar"><div class="xpfill" id="xpfill"></div></div><span class="label" id="levelName"></span></div>
      <div class="stat"><span class="label">Level</span><b id="level">1</b><span class="label">5+ ranks</span></div>
      <div class="stat"><span class="label">Streak</span><b id="streak">1</b><span class="label">days</span></div>
      <div class="stat"><span class="label">Lessons</span><b id="lessons">0/9</b><span class="label">completed</span></div>
    </div>
  </section>
  <section class="grid">
    <div class="modules" id="modules"></div>
    <aside class="side">
      <div class="daily"><h2>Daily Challenge</h2><div class="challenge" id="daily"></div><button class="claim" id="claimDaily">Claim +35 XP</button></div>
      <div class="path"><h2>Learning Path</h2><div class="pathNodes" id="pathNodes"></div></div>
      <div class="leader"><h2>Global Leaderboard</h2><table id="board"></table></div>
    </aside>
  </section>
</main>
<div class="install" id="install"><span>Install this course for app-like offline access.</span><button class="run" id="installBtn">Add to Home Screen</button></div>
<script>
const COURSE={"slug":"claude","title":"Claude","org":"Anthropic","subtitle":"Constitutional AI, safety, long context, and document analysis","accent":"#d6a56d","accent2":"#7dd3fc","accent3":"#fda4af","bg":"#120d09","particle":"embers","levelNames":["Careful Reader","Context Keeper","Safety Analyst","Document Diver","Reasoning Partner","Claude Specialist"],"modules":[{"title":"Claude Foundations","intro":"Understand Claude's safety-oriented design and strengths in careful language tasks.","lessons":[{"heading":"Constitutional AI","body":"Claude is associated with training methods that emphasize helpfulness, honesty, and harmlessness through explicit principles.","code":"Ask: answer, cite uncertainty, avoid unsafe instructions","note":"Tip: Use clear values when asking for policy or safety analysis.","tag":"Core"},{"heading":"Long Context","body":"Claude is known for handling long documents and extended conversations well, making it strong for contracts, reports, and research packets.","code":"Upload/report input -> ask for summary, risks, contradictions","note":"Warning: Long context still needs precise questions.","tag":"Practice"},{"heading":"Writing and Analysis","body":"Claude often performs well on nuanced writing, synthesis, tone control, and document critique.","code":"Rewrite for: calm expert tone\nPreserve: legal meanings","note":"Badge: Claude shines when nuance matters.","tag":"Mastery"}],"quiz":[{"q":"What is the strongest first habit for \"Claude Foundations\"?","options":["Give context, constraints, and success criteria","Use the shortest possible prompt","Trust every answer without review"],"answer":0,"explanation":"Context and success criteria make the model's job observable and easier to verify."},{"q":"What should you do when an AI answer affects an important decision?","options":["Verify with evidence or tests","Accept it because it sounds confident","Remove all constraints"],"answer":0,"explanation":"Verification protects you from stale facts, hallucinations, and misunderstood context."},{"q":"Which workflow is most reliable for learning this module?","options":["Learn, practice, get feedback, then save the reusable pattern","Read once and never test","Use only one broad prompt for everything"],"answer":0,"explanation":"Reusable patterns and feedback loops help skill compound over time."}]},{"title":"Document Workflows","intro":"Use Claude for PDFs, policy docs, transcripts, and knowledge synthesis.","lessons":[{"heading":"Document Triage","body":"Ask for executive summary, key claims, evidence, risks, and missing information.","code":"Output table: section, claim, evidence, concern","note":"Tip: Request quotes or section references for auditability.","tag":"Core"},{"heading":"Comparison","body":"Claude can compare drafts, versions, vendor proposals, or policy changes.","code":"Compare A vs B:\nchanges, impact, risk, recommendation","note":"Warning: Never rely on summary alone for binding legal terms.","tag":"Practice"},{"heading":"Synthesis","body":"For multiple sources, ask it to separate consensus, disagreement, and unknowns.","code":"Consensus\nDisagreements\nOpen questions\nNext research","note":"Badge: Good synthesis preserves disagreement.","tag":"Mastery"}],"quiz":[{"q":"What is the strongest first habit for \"Document Workflows\"?","options":["Give context, constraints, and success criteria","Use the shortest possible prompt","Trust every answer without review"],"answer":0,"explanation":"Context and success criteria make the model's job observable and easier to verify."},{"q":"What should you do when an AI answer affects an important decision?","options":["Verify with evidence or tests","Accept it because it sounds confident","Remove all constraints"],"answer":0,"explanation":"Verification protects you from stale facts, hallucinations, and misunderstood context."},{"q":"Which workflow is most reliable for learning this module?","options":["Learn, practice, get feedback, then save the reusable pattern","Read once and never test","Use only one broad prompt for everything"],"answer":0,"explanation":"Reusable patterns and feedback loops help skill compound over time."}]},{"title":"Safe Reasoning","intro":"Design workflows where Claude is useful and bounded.","lessons":[{"heading":"Risk Reviews","body":"Use Claude to identify safety, privacy, compliance, and communication risks.","code":"Review this launch plan for: privacy, bias, misuse, support load","note":"Tip: Ask for severity and mitigation.","tag":"Core"},{"heading":"Refusal Boundaries","body":"Safety-focused models may refuse harmful or ambiguous requests; clarify legitimate context.","code":"I am doing defensive security training on my own lab machine...","note":"Warning: Do not try to bypass safety controls.","tag":"Practice"},{"heading":"Human Judgment","body":"Claude can frame decisions, but accountable humans must decide in high-stakes domains.","code":"Recommendation\nRationale\nConfidence\nHuman review required","note":"Badge: Safe AI makes responsibility clearer.","tag":"Mastery"}],"quiz":[{"q":"What is the strongest first habit for \"Safe Reasoning\"?","options":["Give context, constraints, and success criteria","Use the shortest possible prompt","Trust every answer without review"],"answer":0,"explanation":"Context and success criteria make the model's job observable and easier to verify."},{"q":"What should you do when an AI answer affects an important decision?","options":["Verify with evidence or tests","Accept it because it sounds confident","Remove all constraints"],"answer":0,"explanation":"Verification protects you from stale facts, hallucinations, and misunderstood context."},{"q":"Which workflow is most reliable for learning this module?","options":["Learn, practice, get feedback, then save the reusable pattern","Read once and never test","Use only one broad prompt for everything"],"answer":0,"explanation":"Reusable patterns and feedback loops help skill compound over time."}]}],"sandboxResponses":["Claude-style output should be careful, nuanced, and explicit about uncertainty.","For long docs, ask for section references and risk tables.","Use compare-and-contrast prompts for contracts or policy drafts.","Safety framing improves the quality of sensitive answers."]};
const KEY="course:"+COURSE.slug+":v1";
const XP_PER_Q=25, XP_LESSON=8, XP_DAILY=35;
const chips=["Explain like I'm new","Give a pro workflow","Show pitfalls","Create a reusable template"];
let deferredPrompt=null;
const state=load();
function load(){const fresh={xp:0,lessons:{},quizzes:{},daily:{},lastDay:"",streak:1};try{return Object.assign(fresh,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return fresh}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderStats();renderPath();renderBoard()}
function today(){return new Date().toISOString().slice(0,10)}
function escText(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function levelInfo(){const level=Math.min(6,Math.floor(state.xp/150)+1);const base=(level-1)*150;const pct=Math.min(100,((state.xp-base)/150)*100);return{level,pct,name:COURSE.levelNames[level-1]||COURSE.levelNames.at(-1)}}
function renderStats(){const li=levelInfo();document.getElementById("xp").textContent=state.xp;document.getElementById("level").textContent=li.level;document.getElementById("levelName").textContent=li.name;document.getElementById("xpfill").style.width=li.pct+"%";document.getElementById("streak").textContent=state.streak||1;document.getElementById("lessons").textContent=Object.keys(state.lessons||{}).length+"/9"}
function addXP(n,msg){state.xp+=n;save();toast("Achievement unlocked",msg+" +" + n + " XP")}
function toast(t,b){const el=document.createElement("div");el.className="pop";el.innerHTML="<b>"+escText(t)+"</b><div>"+escText(b)+"</div>";document.getElementById("toast").appendChild(el);setTimeout(()=>el.remove(),4200)}
function isUnlocked(i){if(i===0)return true;return !!state.quizzes["m"+(i-1)]}
function renderModules(){const root=document.getElementById("modules");root.innerHTML="";COURSE.modules.forEach((m,i)=>{const locked=!isUnlocked(i);const mod=document.createElement("article");mod.className="module "+(locked?"lock":"");mod.innerHTML='<div class="modHead"><div class="modTitle"><div class="nodeBadge">'+(locked?"🔒":i+1)+'</div><div><h2>'+escText(m.title)+'</h2><div class="label">'+escText(m.intro)+'</div></div></div><span class="pill">'+(locked?"Locked":"Open")+'</span></div><div class="tabs"><button class="tab active">📖 Learn</button><button class="tab">🧠 Quiz</button><button class="tab">🧪 Sandbox</button></div><div class="panel active"></div><div class="panel"></div><div class="panel"></div>';root.appendChild(mod);const tabs=[...mod.querySelectorAll(".tab")],panels=[...mod.querySelectorAll(".panel")];tabs.forEach((tab,ti)=>tab.onclick=()=>{if(locked){toast("Module locked","Complete the previous module quiz first.");return}tabs.forEach(x=>x.classList.remove("active"));panels.forEach(x=>x.classList.remove("active"));tab.classList.add("active");panels[ti].classList.add("active")});renderLearn(panels[0],m,i,locked);renderQuiz(panels[1],m,i,locked);renderSandbox(panels[2],i,locked)})}
function renderLearn(panel,m,mi,locked){panel.innerHTML=m.lessons.map((l,li)=>'<div class="lesson"><span class="tag">'+l.tag+'</span><h3>'+escText(l.heading)+'</h3><p>'+escText(l.body)+'</p><pre><code>'+escText(l.code)+'</code></pre><div class="note">'+escText(l.note)+'</div><button class="claim" data-lesson="'+mi+'-'+li+'">'+(state.lessons[mi+"-"+li]?"Completed":"Mark lesson complete +8 XP")+'</button></div>').join("");panel.querySelectorAll("[data-lesson]").forEach(btn=>btn.onclick=()=>{const id=btn.dataset.lesson;if(locked)return;if(!state.lessons[id]){state.lessons[id]=true;btn.textContent="Completed";addXP(XP_LESSON,"Lesson completed")}})}
function renderQuiz(panel,m,mi,locked){panel.innerHTML=m.quiz.map((q,qi)=>'<div class="quizBox"><b>Q'+(qi+1)+'. '+escText(q.q)+'</b><div class="options">'+q.options.map((o,oi)=>'<button class="option" data-q="'+qi+'" data-o="'+oi+'">'+escText(o)+'</button>').join("")+'</div><div class="feedback" id="fb-'+mi+'-'+qi+'"></div></div>').join("");panel.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{if(locked)return;const qi=+btn.dataset.q,oi=+btn.dataset.o,q=m.quiz[qi],box=btn.closest(".quizBox");if(box.dataset.done)return;box.dataset.done="1";box.querySelectorAll(".option").forEach((b,idx)=>b.classList.add(idx===q.answer?"correct":idx===oi?"wrong":""));document.getElementById("fb-"+mi+"-"+qi).textContent=(oi===q.answer?"Correct. ":"Not quite. ")+q.explanation;if(oi===q.answer)addXP(XP_PER_Q,"Quiz answer mastered");if([...panel.querySelectorAll(".quizBox")].every(x=>x.dataset.done)){state.quizzes["m"+mi]=true;save();renderModules();toast("Module unlocked",mi<2?"Next module is now available.":"Course path completed.")}})}
function renderSandbox(panel,mi,locked){panel.innerHTML='<div class="sandbox"><b>Prompt Simulator</b><div class="chips">'+chips.map(c=>'<button class="chip">'+c+'</button>').join("")+'</div><textarea class="prompt" placeholder="Write a prompt for '+escText(COURSE.title)+'..."></textarea><button class="run">Run Simulation</button><div class="output"></div></div>';const ta=panel.querySelector("textarea"),out=panel.querySelector(".output");panel.querySelectorAll(".chip").forEach((c,i)=>c.onclick=()=>ta.value=c.textContent+": "+COURSE.subtitle);panel.querySelector(".run").onclick=()=>{if(locked)return;const base=COURSE.sandboxResponses[mi%COURSE.sandboxResponses.length]+"\n\nPrompt review: "+(ta.value||"Try a chip template first.")+"\n\nNext step: add audience, constraints, and output format.";type(out,base)}}
function type(el,text){el.textContent="";let i=0;const timer=setInterval(()=>{el.textContent+=text[i++]||"";if(i>text.length)clearInterval(timer)},18)}
function renderDaily(){const prompts=["Create a 5-line prompt template for a real task.","List 3 risks and 3 mitigations for this AI tool.","Design a tiny workflow that saves 20 minutes today.","Compare this tool with another model in one table."];document.getElementById("daily").textContent=prompts[Math.floor(Date.now()/86400000)%prompts.length];document.getElementById("claimDaily").onclick=()=>{const d=today();if(state.daily[d])toast("Already claimed","Come back tomorrow for a new challenge.");else{state.daily[d]=true;if(state.lastDay){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);state.streak=state.lastDay===y?(state.streak||1)+1:1}state.lastDay=d;addXP(XP_DAILY,"Daily challenge complete")}}}
function renderPath(){const root=document.getElementById("pathNodes");root.innerHTML="";for(let i=0;i<3;i++){const n=document.createElement("div");n.className="pathNode "+(state.quizzes["m"+i]?"done":"");n.textContent=state.quizzes["m"+i]?"✓":"M"+(i+1);root.appendChild(n)}}
function renderBoard(){const rows=[["Nova",740],["Mira",620],["You",state.xp],["Kai",310],["Sol",190]].sort((a,b)=>b[1]-a[1]);document.getElementById("board").innerHTML=rows.map((r,i)=>'<tr class="'+(r[0]==="You"?"you":"")+'"><td>#'+(i+1)+'</td><td>'+r[0]+'</td><td>'+r[1]+' XP</td></tr>').join("")}
function particles(){const root=document.getElementById("stars");const count=COURSE.particle==="matrix"?95:70;for(let i=0;i<count;i++){const p=document.createElement("i");p.className="particle";p.style.cssText="--x:"+Math.random()*100+"vw;--drift:"+(Math.random()*40-20)+"vw;--s:"+(Math.random()*1.5+.35)+";--d:"+(Math.random()*18+10)+"s;left:0;top:0;width:"+(Math.random()*3+1)+"px;height:"+(Math.random()*3+1)+"px;animation-delay:-"+Math.random()*20+"s";root.appendChild(p)}}
function net(){const n=document.getElementById("net");n.textContent=navigator.onLine?"Online":"Offline";n.className="pill "+(navigator.onLine?"online":"offline")}addEventListener("online",net);addEventListener("offline",net);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("install").style.display="flex"});document.getElementById("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById("install").style.display="none"}};
async function pwa(){const manifest={name:COURSE.title+" AI Course",short_name:COURSE.title,start_url:location.href,display:"standalone",background_color:COURSE.bg,theme_color:COURSE.bg,icons:[]};const ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));document.head.appendChild(ml);if("serviceWorker"in navigator&&location.protocol!=="file:"){const sw='const CACHE="'+KEY+'";self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(["./"]))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return res}).catch(()=>caches.match("./")))))';try{await navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"text/javascript"})));}catch(e){console.warn(e)}}}
